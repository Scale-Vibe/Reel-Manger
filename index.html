<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScaleVibe Admin</title>
<style>
:root{--bg:#F4F6FB;--card:#fff;--tx:#0B1B33;--mu:#6a7890;--ln:rgba(11,27,51,.1);--g:linear-gradient(95deg,#4C8CF7,#2BA3E0 50%,#2FD4AB);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121f;--card:#0f1f36;--tx:#eaf0fb;--mu:#8fa2c0;--ln:rgba(255,255,255,.1)}}
*{box-sizing:border-box;margin:0}html{height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;min-height:100%}
.w{max-width:900px;margin:0 auto;padding:16px}h1{font-size:1.3rem;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}h1 i{width:28px;height:28px;border-radius:9px;background:var(--g)}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tabs button{flex:none}
button,.b{font:600 .85rem inherit;font-family:inherit;border:0;border-radius:30px;padding:9px 16px;cursor:pointer;background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln);text-decoration:none;display:inline-block}
button.on,.b.p{background:var(--g);color:#fff;box-shadow:none}.b.wa{background:#25D366;color:#fff;box-shadow:none}button.d{color:#d33}
.c{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px var(--ln)}.c h3{font-size:1rem}.mu{color:var(--mu);font-size:.85rem}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx)}
.r{display:grid;gap:8px;margin-top:10px}@media(min-width:700px){.r.s{grid-template-columns:1fr 1fr 1fr}.r.t{grid-template-columns:110px 1.3fr 1fr 1.3fr 1.4fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.pill{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--bg)}
.sw{all:unset;cursor:pointer;width:48px;height:28px;border-radius:20px;background:#9aa7bd;position:relative;transition:.3s;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}.sw.on{background:#2FD4AB}.sw.on::after{left:23px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.lg{max-width:380px;margin:12vh auto}
</style></head><body><div class="w" id="app"></div><div id="toast"></div>
<script>
var API_DEFAULT='https://script.google.com/macros/s/AKfycbyFivyX238ll3i7jVTzQ7ykPTeNOKkc-IFvHAMJ-pJTISTE3NJKRcJDL3Hlwc_dlmmo7g/exec';
var $=function(s){return document.querySelector(s)};
function sg(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}function ss(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function lg(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var st={api:lg('api')||API_DEFAULT,pw:sg('pw'),tab:'leads'},app=$('#app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2200)}
function call(a,d){return fetch(st.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:a,pw:st.pw},d||{}))}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
function login(msg){app.innerHTML='<div class="lg c"><h1><i></i>ScaleVibe Admin</h1><p class="mu" style="margin-top:6px">'+(msg||'Sign in to manage leads, services, invitations and feature flags.')+'</p><div class="r"><input id="pw" type="password" placeholder="Admin password"><input id="api" placeholder="Apps Script /exec URL" value="'+esc(st.api)+'"><button class="p b on" id="go">Sign in</button></div></div>';
 $('#go').onclick=function(){st.pw=$('#pw').value;st.api=$('#api').value.trim();call('ping').then(function(){ss('pw',st.pw);ls('api',st.api);shell()}).catch(function(e){login(e.message==='Failed to fetch'?'Could not reach the backend. Check the URL and deployment.':e.message)})}}
var TABS=[['leads','Leads'],['services','Services & prices'],['gallery','Invitations & mockups'],['flags','Features (GrowthBook)']];
function shell(){app.innerHTML='<div class="top"><h1><i></i>ScaleVibe Admin</h1><button id="so">Sign out</button></div><div class="tabs">'+TABS.map(function(t){return'<button data-t="'+t[0]+'"'+(st.tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>'}).join('')+'</div><div id="v"><p class="mu">Loading…</p></div>';
 $('#so').onclick=function(){ss('pw','');st.pw='';login()};document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){st.tab=b.dataset.t;shell()}});V[st.tab]()}
function fail(e){$('#v').innerHTML='<div class="c">⚠️ '+esc(e.message)+'</div>'}
function wa(p,n){p=String(p).replace(/\D/g,'');if(p.length===10)p='91'+p;return'https://wa.me/'+p+'?text='+encodeURIComponent('Hi '+n+', thank you for your interest in ScaleVibe! ')}
var V={
leads:function(){call('leads').then(function(j){var L=j.leads;$('#v').innerHTML=(L.length?'':'<div class="c mu">No leads yet.</div>')+L.map(function(l){return'<div class="c" data-id="'+esc(l.id)+'"><div class="fl"><h3>'+esc(l.name)+'</h3><span class="pill">'+esc(new Date(l.time).toLocaleDateString('en-IN',{day:'numeric',month:'short'}))+'</span></div><p class="mu">'+esc(l.business)+' · '+esc(l.goal)+'</p><div class="row"><b>'+esc(l.phone)+'</b></div><div class="r s"><select class="stt">'+['New','Contacted','Won','Lost'].map(function(s){return'<option'+(s===l.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><input class="nt" placeholder="Note" value="'+esc(l.note)+'"><button class="sv">Save</button></div><div class="row"><a class="b wa" target="_blank" rel="noopener" href="'+wa(l.phone,String(l.name).split(' ')[0])+'">Reply on WhatsApp</a><a class="b" href="tel:'+esc(l.phone)+'">Call</a></div></div>'}).join('');
 document.querySelectorAll('.sv').forEach(function(b){b.onclick=function(){var c=b.closest('.c');call('lead_update',{id:c.dataset.id,status:c.querySelector('.stt').value,note:c.querySelector('.nt').value}).then(function(){toast('Saved')}).catch(function(e){toast(e.message)})}})}).catch(fail)},
services:function(){call('services').then(function(j){var S=j.services;function row(s){return'<div class="c sr"><div class="r t"><select class="g"><option value="pkg"'+(s.g==='pkg'?' selected':'')+'>Package</option><option value="addon"'+(s.g==='addon'?' selected':'')+'>Add-on</option><option value="reel"'+(s.g==='reel'?' selected':'')+'>Reels pack</option></select><input class="n" placeholder="Name" value="'+esc(s.n)+'"><input class="p" placeholder="Price e.g. ₹999" value="'+esc(s.p)+'"><input class="note" placeholder="Short note" value="'+esc(s.note)+'"><input class="f" placeholder="Features separated by |" value="'+esc(s.f)+'"></div><div class="row"><input class="bd" style="max-width:180px" placeholder="Badge" value="'+esc(s.b)+'"><label class="mu"><input class="a" type="checkbox" style="width:auto"'+(s.active===false||String(s.active).toUpperCase()==='FALSE'?'':' checked')+'> Show on site</label><button class="d">Remove</button></div></div>'}
 $('#v').innerHTML='<p class="mu" style="margin-bottom:10px">Edit names and prices. The website updates on the next page load.</p><div id="sl">'+(S.length?S.map(row).join(''):'<div class="c mu">Nothing yet. If your website shows default plans, add them here to take control.</div>')+'</div><div class="row"><button id="ad">+ Add service</button><button class="on" id="sa">Save all</button></div>';
 function bind(){document.querySelectorAll('.sr .d').forEach(function(b){b.onclick=function(){b.closest('.sr').remove()}})}bind();
 $('#ad').onclick=function(){$('#sl').insertAdjacentHTML('beforeend',row({g:'addon',n:'',p:'',note:'',f:'',b:''}));bind()};
 $('#sa').onclick=function(){var rows=[].map.call(document.querySelectorAll('.sr'),function(c){return{g:c.querySelector('.g').value,n:c.querySelector('.n').value,p:c.querySelector('.p').value,note:c.querySelector('.note').value,f:c.querySelector('.f').value,b:c.querySelector('.bd').value,active:c.querySelector('.a').checked}}).filter(function(r){return r.n});call('services_save',{rows:rows}).then(function(){toast('Saved. Live on the site.')}).catch(function(e){toast(e.message)})}}).catch(fail)},
gallery:function(){call('gallery').then(function(j){$('#v').innerHTML='<div class="c"><h3>Add an invitation or project mockup</h3><p class="mu">Upload an HTML file (it is shown inside an iPhone mockup on your site), or an image/PDF.</p><div class="r"><select id="ty"><option value="invite">Invitation</option><option value="project">Project mockup</option></select><input id="ti" placeholder="Title"><input id="de" placeholder="One-line description"><input id="fi" type="file" accept=".html,.htm,image/*,.pdf"><button class="on" id="up">Upload & publish</button></div></div>'+j.items.map(function(i){return'<div class="c fl"><div><h3>'+esc(i.title)+'</h3><p class="mu">'+esc(i.type)+' · '+esc(i.desc)+'</p><a class="mu" target="_blank" rel="noopener" href="'+esc(i.url)+'">Preview</a></div><button class="d" data-id="'+esc(i.id)+'">Delete</button></div>'}).join('');
 document.querySelectorAll('.d').forEach(function(b){b.onclick=function(){if(confirm('Delete this item?'))call('gallery_del',{id:b.dataset.id}).then(function(){toast('Deleted');V.gallery()})}});
 $('#up').onclick=function(){var f=$('#fi').files[0],t=$('#ti').value;if(!f||!t)return toast('Add a title and a file');$('#up').textContent='Uploading…';var rd=new FileReader();rd.onload=function(){var mime=f.type||(/\.html?$/i.test(f.name)?'text/html':'application/octet-stream');call('upload',{name:f.name,mime:mime,data:String(rd.result).split(',')[1]}).then(function(u){return call('gallery_add',{type:$('#ty').value,title:t,desc:$('#de').value,url:u.url})}).then(function(){toast('Published to the site');V.gallery()}).catch(function(e){toast(e.message);$('#up').textContent='Upload & publish'})};rd.readAsDataURL(f)}}).catch(fail)},
flags:function(){call('flags').then(function(j){$('#v').innerHTML='<p class="mu" style="margin-bottom:10px">Switch features on or off instantly, no code changes. Site flags: show_invites, show_packages, show_chatbot, starter_offer_live.</p>'+(j.flags.length?j.flags.map(function(f){return'<div class="c fl"><b>'+esc(f.id)+'</b><button class="sw'+(f.on?' on':'')+'" data-id="'+esc(f.id)+'" aria-label="Toggle '+esc(f.id)+'"></button></div>'}).join(''):'<div class="c mu">No flags found. Create them in GrowthBook first.</div>');
 document.querySelectorAll('.sw').forEach(function(b){b.onclick=function(){var on=!b.classList.contains('on');b.classList.toggle('on',on);call('flag_toggle',{id:b.dataset.id,on:on}).then(function(){toast(b.dataset.id+(on?' is ON':' is OFF'))}).catch(function(e){b.classList.toggle('on',!on);toast(e.message)})}})}).catch(fail)}};
if(st.pw)call('ping').then(shell).catch(function(){login()});else login();
</script></body></html>
