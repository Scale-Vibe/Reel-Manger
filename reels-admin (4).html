<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Scale Vibe Reels Manager</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--alt:#F5F5F7;--tx:#1D1D1F;--mu:#6E6E73;--ln:rgba(0,0,0,.1);--red:#E5484D;--g:linear-gradient(95deg,#FF9A4D,#F3677A 50%,#8E7CF0);--f:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
body{font-family:var(--f);background:var(--alt);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;letter-spacing:-.02em}h1 span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.card h2{font-size:18px;margin-bottom:6px;letter-spacing:-.01em}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:14px 0 6px}
input[type=text],input[type=password],input[type=url],select{width:100%;font:500 15px var(--f);padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus{border-color:#8E7CF0;box-shadow:0 0 0 3px rgba(142,124,240,.2)}
.bad{border-color:var(--red)!important}
.err{color:var(--red);font-size:12.5px;font-weight:600;margin-top:5px}
.row2{display:grid;grid-template-columns:1fr;gap:0 14px}@media(min-width:640px){.row2{grid-template-columns:1fr 1fr}}
.btn{font:600 13px var(--f);background:#fff;color:var(--tx);border:1px solid var(--ln);border-radius:40px;padding:10px 18px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--tx);color:#fff;border-color:var(--tx)}.btn.d{color:var(--red)}.btn.sm{padding:7px 13px;font-size:12px}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.preview{display:none;margin-top:10px;gap:12px;align-items:center}.preview.show{display:flex}
.preview img,.reel img{width:56px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:var(--alt)}
.preview small{color:var(--mu);font-size:12px}
.reel{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);border-radius:16px;margin-top:12px}
.meta{min-width:0}.meta b{display:block;font-size:15px}
.meta span{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--ln);padding-top:10px}
.sp{flex:1}
.mv{display:flex;gap:4px}.mv button{width:32px;height:30px;border:1px solid var(--ln);border-radius:8px;background:#fff;cursor:pointer;display:grid;place-items:center}
.mv button:disabled{opacity:.3}.mv svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tg{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:12px;cursor:pointer;margin:0;color:var(--tx)}
.tg input{display:none}.tr{width:40px;height:23px;border-radius:20px;background:#d1d1d6;position:relative;transition:.2s}
.tr::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg input:checked+.tr{background:#34C759}.tg input:checked+.tr::after{transform:translateX(17px)}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:#fff;padding:11px 18px;border-radius:40px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.bad{background:var(--red)}
#login{max-width:380px;margin:12vh auto 0}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card"><h2>Admin login</h2>
<form id="lf"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>
<div class="err" id="lerr"></div><div class="actions"><button class="btn p" id="lb">Log in</button></div></form></div>

<div id="app" hidden>
<div class="top"><h1>Scale Vibe <span>Reels</span></h1><button class="btn sm" id="out" type="button">Log out</button></div>
<div class="card" id="fc"><h2 id="ft">Add reel</h2>
<form id="rf" novalidate>
<label for="link">YouTube link</label>
<input type="text" id="link" placeholder="youtube.com/shorts/..., youtu.be/... or watch?v=..." autocomplete="off">
<div class="err" id="linkE"></div>
<div class="preview" id="pv"><img id="th" alt=""><div><b style="font-size:13px">Is this the right video?</b><br><small id="idO"></small></div></div>
<div class="row2">
<div><label for="title">Niche (shown as tag and chip)</label><input type="text" id="title" maxlength="200" placeholder="Dentist"><div class="err" id="titleE"></div></div>
<div><label for="cta">Button label</label><input type="text" id="cta" maxlength="200" placeholder="Get this for my clinic"><div class="err" id="ctaE"></div></div>
</div>
<label for="cat">Pre-selects this in the contact form</label>
<select id="cat"></select><div class="err" id="catE"></div>
<label for="hook">Hook (headline on the reel)</label>
<input type="text" id="hook" maxlength="200" placeholder="Own a dental clinic?"><div class="err" id="hookE"></div>
<label for="cap">Caption (one line)</label>
<input type="text" id="cap" maxlength="200" placeholder="Online appointment slots and review requests."><div class="err" id="capE"></div>
<label for="ig">Instagram link (optional)</label>
<input type="url" id="ig" placeholder="https://instagram.com/reel/..."><div class="err" id="igE"></div>
<label class="tg" style="margin-top:16px"><input type="checkbox" id="pub"><span class="tr"></span> Published</label>
<div class="actions"><button class="btn p" type="submit" id="sb">Save reel</button><button class="btn" type="button" id="cb" hidden>Cancel edit</button></div>
</form></div>
<div class="card"><h2>All reels</h2><div id="list"></div></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
// Paste your Apps Script web app URL (ends with /exec)
const API_URL='PASTE_REELS_WEB_APP_URL';
const CATS=['Restaurant / Food Stall','Clinic / Doctor','Tuition Center','Salon / Barbershop','Retail Store','Other Service'];
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('sv_reels_token')||'',reels=[],editing=null,yt='';
const UP='<svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg>',DN='<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
$('cat').innerHTML='<option value="">Choose category</option>'+CATS.map(c=>'<option>'+c+'</option>').join('');

async function post(body){
  if(API_URL.indexOf('PASTE_')===0)throw new Error('Set API_URL first');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}
async function api(p){
  const d=await post(Object.assign({token},p));
  if(d.error==='unauthorized'){logout();throw new Error('Session expired. Log in again.')}
  if(!d.ok)throw new Error(d.error||'Request failed');
  return d;
}
function toast(m,bad){const t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}
function err(k,m){$(k+'E').textContent=m||'';const i=$(k);if(i)i.classList.toggle('bad',!!m)}

function showApp(){$('login').hidden=true;$('app').hidden=false;load()}
function logout(){token='';sessionStorage.removeItem('sv_reels_token');$('app').hidden=true;$('login').hidden=false;$('pw').value=''}
$('out').onclick=logout;
$('lf').addEventListener('submit',async e=>{
  e.preventDefault();$('lerr').textContent='';$('lb').disabled=true;
  try{const d=await post({action:'login',password:$('pw').value});if(!d.ok)throw new Error(d.error||'Login failed');
    token=d.token;sessionStorage.setItem('sv_reels_token',token);showApp()}
  catch(x){$('lerr').textContent=x.message}
  $('lb').disabled=false;
});

const ID='([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])';
function ytId(s){s=String(s||'').trim();if(!s)return'';if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;
  let m=s.match(new RegExp('(?:youtube(?:-nocookie)?\\.com/(?:shorts|embed|live|v)/|youtu\\.be/)'+ID));if(m)return m[1];
  m=s.match(new RegExp('[?&]v='+ID));return m?m[1]:''}
function preview(){
  const raw=$('link').value.trim();yt=ytId(raw);
  if(!raw){err('link','');$('pv').classList.remove('show');return}
  if(!yt){err('link','No valid 11-character YouTube ID found in this link.');$('pv').classList.remove('show');return}
  err('link','');$('th').src='https://img.youtube.com/vi/'+yt+'/hqdefault.jpg';$('idO').textContent='Video ID: '+yt;$('pv').classList.add('show');
}
$('link').addEventListener('input',preview);
$('link').addEventListener('paste',()=>setTimeout(preview,0));

function reset(){editing=null;yt='';$('rf').reset();$('pv').classList.remove('show');
  ['link','title','cta','cat','hook','cap','ig'].forEach(k=>err(k,''));
  $('ft').textContent='Add reel';$('sb').textContent='Save reel';$('cb').hidden=true}
$('cb').onclick=reset;
function read(){return{id:editing||'',title:$('title').value.trim(),hook:$('hook').value.trim(),caption:$('cap').value.trim(),
  cta_text:$('cta').value.trim(),youtube_id:yt,form_category:$('cat').value,instagram_url:$('ig').value.trim(),is_published:$('pub').checked}}
function valid(r){
  let ok=true;
  [['title','title','Niche is required.'],['cta_text','cta','Button label is required.'],['hook','hook','Hook is required.'],['caption','cap','Caption is required.'],['form_category','cat','Pick a category.']]
    .forEach(([k,el,m])=>{if(!r[k]){err(el,m);ok=false}else err(el,'')});
  if(!r.youtube_id){err('link','Paste a valid YouTube link.');ok=false}
  if(r.instagram_url&&!/^https:\/\/(www\.)?instagram\.com\/\S+$/i.test(r.instagram_url)){err('ig','Must be a full https://instagram.com/... link.');ok=false}else err('ig','');
  return ok}
$('rf').addEventListener('submit',async e=>{
  e.preventDefault();const r=read();if(!valid(r))return;$('sb').disabled=true;
  try{await api({action:'save',reel:r});toast(editing?'Reel updated':'Reel added');reset();await load()}catch(x){toast(x.message,true)}
  $('sb').disabled=false;
});

async function load(){try{reels=(await api({action:'list'})).reels;render()}catch(x){toast(x.message,true)}}
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function render(){
  const box=$('list');box.innerHTML='';
  if(!reels.length){box.innerHTML='<div class="empty">No reels yet. Add your first one above.</div>';return}
  reels.forEach((r,i)=>{
    const d=el('div','reel'),img=el('img');img.src='https://img.youtube.com/vi/'+r.youtube_id+'/hqdefault.jpg';img.alt='';img.loading='lazy';
    const m=el('div','meta');m.append(el('b','',r.title),el('span','',r.hook),el('span','',r.form_category+(r.instagram_url?'  |  Instagram set':'  |  No Instagram link')));
    const t=el('div','tools'),mv=el('div','mv'),up=el('button'),dn=el('button');
    up.type=dn.type='button';up.innerHTML=UP;dn.innerHTML=DN;up.title='Move up';dn.title='Move down';up.disabled=i===0;dn.disabled=i===reels.length-1;
    up.onclick=()=>move(i,-1);dn.onclick=()=>move(i,1);mv.append(up,dn);
    const tg=el('label','tg'),cb=el('input');cb.type='checkbox';cb.checked=r.is_published;const tx=el('span','',r.is_published?'Published':'Draft');
    tg.append(cb,el('span','tr'),tx);
    cb.onchange=async()=>{cb.disabled=true;try{await api({action:'setPublished',id:r.id,is_published:cb.checked});r.is_published=cb.checked;tx.textContent=cb.checked?'Published':'Draft'}
      catch(x){cb.checked=!cb.checked;toast(x.message,true)}cb.disabled=false};
    const ed=el('button','btn sm','Edit'),del=el('button','btn sm d','Delete');ed.type=del.type='button';
    ed.onclick=()=>edit(r);
    del.onclick=async()=>{if(!confirm('Delete "'+r.title+'"? This cannot be undone.'))return;
      try{await api({action:'delete',id:r.id});toast('Reel deleted');if(editing===r.id)reset();load()}catch(x){toast(x.message,true)}};
    t.append(mv,tg,el('span','sp'),ed,del);d.append(img,m,t);box.appendChild(d);
  });
}
async function move(i,dir){const j=i+dir;if(j<0||j>=reels.length)return;[reels[i],reels[j]]=[reels[j],reels[i]];render();
  try{await api({action:'reorder',ids:reels.map(r=>r.id)});toast('Order saved')}catch(x){toast(x.message,true);load()}}
function edit(r){editing=r.id;$('link').value='https://youtube.com/shorts/'+r.youtube_id;$('title').value=r.title;$('hook').value=r.hook;$('cap').value=r.caption;
  $('cta').value=r.cta_text;$('cat').value=r.form_category;$('ig').value=r.instagram_url||'';$('pub').checked=r.is_published;preview();
  $('ft').textContent='Edit reel';$('sb').textContent='Update reel';$('cb').hidden=false;$('fc').scrollIntoView({behavior:'smooth',block:'start'})}
if(token)showApp();
</script>
</body>
</html>
